version: 2
updates:
  - package-ecosystem: "nuget"
    open-pull-requests-limit: 0
    directories:
      - "/AvaloniaApplication1"
      - "/AvaloniaTests"
      - "/SheetMusicLib"
      - "/SheetMusicViewer.Desktop"
      - "/SheetMusicViewer"
      - "/Tests"
      - "/WpfApp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
